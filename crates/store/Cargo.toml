[package]
name = "hearth-store"
description = "Local store for Hearth Suite, embedded SQLite metadata/Records plus an encrypted document vault."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
chacha20poly1305 = "0.10.1"
getrandom = "0.3.4"
hkdf = "0.13.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.1"
thiserror = "2.0.18"
uuid = { version = "1.20.0", features = ["v4"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
