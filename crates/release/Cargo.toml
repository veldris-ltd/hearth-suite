[package]
name = "hearth-release"
description = "Signed TUF-style release metadata and update verification for Hearth Suite clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
hearth-seal = { path = "../seal" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.1"
base64 = "0.22.1"
thiserror = "2.0.18"

[dev-dependencies]
# Integration tests run the `hearth-tuf-sign` binary and rebuild the role key
# from its seed to mirror the release-service's pinned-root verification.
hearth-seal = { path = "../seal" }
base64 = "0.22.1"

[lints]
workspace = true
