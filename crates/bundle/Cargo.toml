[package]
name = "hearth-bundle"
description = "Hearth Suite Bundle container, signed, optionally sealed project archive (manifest, documents, data sources, assets)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
clap = { version = "4.5.61", features = ["derive"] }
hearth-odf-io = { version = "0.0.0", path = "../odf-io" }
hmac = "0.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.1"
thiserror = "2.0.18"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
proptest = "1.9.0"
