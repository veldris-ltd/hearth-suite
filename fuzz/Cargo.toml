# Coverage-guided fuzz targets (cargo-fuzz / libFuzzer). NOT a workspace member
# (see the root Cargo.toml `exclude`): it requires a nightly toolchain + sanitizer
# runtime and is exercised by the CI `fuzz` job, not the toolchain-light gate.
[package]
name = "hearth-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hearth-odf-io = { path = "../crates/odf-io" }
hearth-legacy-import = { path = "../crates/legacy-import" }
hearth-bundle = { path = "../crates/bundle" }

[[bin]]
name = "bundle_read"
path = "fuzz_targets/bundle_read.rs"
test = false
doc = false

[[bin]]
name = "odf_read"
path = "fuzz_targets/odf_read.rs"
test = false
doc = false

[[bin]]
name = "docx_import"
path = "fuzz_targets/docx_import.rs"
test = false
doc = false

[[bin]]
name = "xlsx_import"
path = "fuzz_targets/xlsx_import.rs"
test = false
doc = false

[[bin]]
name = "legacy_import"
path = "fuzz_targets/legacy_import.rs"
test = false
doc = false

# Keep this crate self-contained; do not attach to the parent workspace.
[workspace]
