packages:
  - "apps/*"
  - "packages/*"

# Supply-chain hardening (pnpm 10): wait a week before installing newly
# published versions, refuse trust downgrades between versions, and refuse
# transitive dependencies from git/tarball URLs.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true

# Patched transitive dependencies (dependency audit, 26 October 2026). Each
# override lifts a vulnerable range to its fixed release within the same major;
# drop an entry once the direct dependency ships the fix itself.
overrides:
  "brace-expansion@<1.1.21": "1.1.21"
  "brace-expansion@>=2.0.0 <2.1.7": "2.1.7"
  "brace-expansion@>=3.0.0 <5.0.12": "5.0.12"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "tar@<7.5.22": "7.5.22"
  "@xmldom/xmldom@>=0.9.0 <0.9.12": "0.9.12"
  "postcss@<8.5.31": "8.5.31"
  "nanoid@<3.3.20": "3.3.20"
  "source-map-js@<1.2.2": "1.2.2"
  "minimatch@>=7.0.0 <11.0.1": "11.0.2"
  "glob@>=9.0.0 <14.0.2": "14.0.2"
