# Toolchain for the ci/jobs/*.sh scripts on GitHub Actions (ADR-HS-006).
# GitLab gets the same tools from the CI image built from ci/image/Dockerfile.
name: setup
description: Rust, Node.js 22 and pnpm, with caches.
inputs:
  rust-toolchain:
    description: Rust toolchain (keep in step with rust-toolchain.toml)
    default: "1.99.0"
  rust-components:
    description: Extra rustup components
    default: ""
  rust-targets:
    description: Extra rustup targets
    default: ""
  node:
    description: Install Node.js and pnpm
    default: "true"
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        components: ${{ inputs.rust-components }}
        targets: ${{ inputs.rust-targets }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.rust-toolchain }}-${{ inputs.rust-targets }}
    - if: inputs.node == 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: pnpm
