name: Bug report
description: Report a problem with Hearth Suite
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Hearth Suite.

        ⚠️ **Privacy:** never paste private document content, recovery phrases, or
        keys. Hearth Suite is local-first, we cannot see your data, and neither should
        an issue. For a **security vulnerability**, use private reporting (see
        `SECURITY.md`), not a public issue.
  - type: input
    id: version
    attributes:
      label: Hearth Suite version
      placeholder: "e.g. 1.0.0 (or commit SHA)"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - iOS
        - Android
        - Self-hosted service
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (redacted)
      description: Relevant, redacted logs or error messages. Remove any content or keys.
      render: shell
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This report contains no private document content, recovery phrases, or keys.
          required: true
        - label: This is not a security vulnerability (those are reported privately).
          required: true
