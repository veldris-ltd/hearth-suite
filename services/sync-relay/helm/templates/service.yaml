apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-sync-relay
  labels:
    app: hearth-sync-relay
spec:
  type: {{ .Values.service.type }}
  selector:
    app: hearth-sync-relay
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
