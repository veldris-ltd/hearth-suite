apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-key-directory
  labels:
    app: hearth-key-directory
spec:
  type: {{ .Values.service.type }}
  selector:
    app: hearth-key-directory
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
