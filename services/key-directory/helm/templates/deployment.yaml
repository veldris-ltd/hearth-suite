apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-key-directory
  labels:
    app: hearth-key-directory
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: hearth-key-directory
  template:
    metadata:
      labels:
        app: hearth-key-directory
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: key-directory
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: {{ .Values.config.databaseUrl | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
