apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-release-service
  labels:
    app: hearth-release-service
spec:
  type: {{ .Values.service.type }}
  selector:
    app: hearth-release-service
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
