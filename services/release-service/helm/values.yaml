replicaCount: 2

image:
  repository: ghcr.io/veldris-ltd/hearth-suite/release-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

# The pinned ML-DSA root verifying key and the CI publish token. Provision via a
# Secret in production rather than plain values.
config:
  rootKeyId: hearth-root-2026
  rootPubkeyB64: ""
  publishTokenSecret: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
